[package]
name = "scrcpy-slint"
version = "0.1.0"
edition = "2021"
description = "A Rust scrcpy client with a Slint user interface — mirror and control Android devices"
license = "Apache-2.0"
repository = "https://github.com/bdrtr/scrcpy-panel"

[dependencies]
cpal = "0.18"
arboard = { version = "3.6", features = ["wayland-data-control"] }
# The desktop's own file chooser, over the XDG portal rather than GTK, so this
# stays a Wayland-native dialog with no toolkit linked in.
# The desktop's screensaver inhibition lives on the session bus.
zbus = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ffmpeg-next = "9"
ffmpeg-sys-next = "9"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
crossbeam-channel = "0.5"
byteorder = "1"
libc = "0.2"
# unstable-winit-030 reaches the winit window under Slint's own, which is the
# only way to get --always-on-top and --borderless: Slint's Window API has
# neither.
slint = { version = "1.17", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11.2"
rusb = "0.9.4"

[features]
# Slint's WGPU renderer and its texture import, for `examples/frame_cost.rs`
# and for whatever roadmap item 7 turns into. Off by default on purpose:
# linking the WGPU renderer in also makes Slint pick it, and that costs 0.67 ms
# a frame before it saves anything — see the README.
wgpu = ["slint/unstable-wgpu-29", "slint/renderer-femtovg-wgpu"]

[profile.release]
lto = true
strip = true
opt-level = 3

[dev-dependencies]
# Only for the shader's own test, which needs a wgpu device of its own rather
# than the one Slint hands out inside a window. Already in the tree: wgpu
# depends on it.
pollster = "0.4"

[build-dependencies]
slint-build = "1.17"
