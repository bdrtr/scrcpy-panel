[package]
name = "scrcpy-slint"
version = "0.1.0"
edition = "2021"
description = "A Rust scrcpy client with a Slint user interface — mirror and control Android devices"
license = "Apache-2.0"
repository = "https://github.com/bdrtr/scrcpy-panel"

[dependencies]
cpal = "0.18"
arboard = { version = "3.6", features = ["wayland-data-control"] }
# The desktop's own file chooser, over the XDG portal rather than GTK, so this
# stays a Wayland-native dialog with no toolkit linked in.
# The desktop's screensaver inhibition lives on the session bus.
zbus = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ffmpeg-next = "9"
ffmpeg-sys-next = "9"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
crossbeam-channel = "0.5"
byteorder = "1"
libc = "0.2"
slint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = 3

[build-dependencies]
slint-build = "1.17"
